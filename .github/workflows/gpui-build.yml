name: GPUI Build (reusable)

# Workflow riusabile per app desktop Rust NATIVE disegnate con GPUI (gpui-kit/gpui-component),
# fratello di `tauri-build.yml`: stessi input di scelta (runner_type, max_workers, clear_cache),
# stessa validazione dei target, stesso build-kit per worker e cache, stesse notifiche.
# Chiamato da thin wrapper nei progetti via:
#   uses: GabryXnLab/desktop-ci/.github/workflows/gpui-build.yml@main
#
# Differenze da Tauri: niente frontend JS né WebView; il prodotto è un binario unico per
# target (font e icone incorporati), compresso (tar.gz su Linux/macOS, zip su Windows).
#
# Pacchetti (`package: true`): `cargo packager` (crabnebula-dev/cargo-packager, lo stesso
# bundler di Tauri estratto in uno strumento a sé) legge `[package.metadata.packager]` del
# Cargo.toml del progetto e produce deb + AppImage (Linux), installer NSIS (Windows), app +
# dmg (macOS). Con la chiave dell'updater (secret TAURI_SIGNING_*, stesso formato minisign
# di Tauri) ogni pacchetto ha il suo `.sig`.
#
# Pubblicazione (`publish_release: true`): release `<release_tag_prefix><versione>` su
# `releases_repo` coi pacchetti; il manifest dell'updater lo scrive `manifest_command` del
# progetto (manifest per canale, release a tag fisso) o, senza, un `latest.json` di Tauri v2
# nella release stessa.
#
# ⚠️ Build NATIVA per OS e architettura, come Tauri (target `platforms`, CSV):
#   linux-x64 · linux-arm64 · windows · macos  (stessi alias di tauri-build.yml)
# Con runner_type=self-hosted l'ambiente è Linux ARM64: gli altri target senza override
# *_runner fanno fallire `setup` con errore esplicito e nessuna build parte.

on:
  workflow_call:
    inputs:
      app_name:
        description: 'Nome app (artifact name e notifiche Telegram)'
        required: true
        type: string
      bin_name:
        description: 'Nome del binario prodotto da cargo (il [package].name del crate)'
        required: true
        type: string
      platforms:
        description: 'Target da buildare, CSV: es. "linux-x64,linux-arm64,windows,macos" (1 o più)'
        required: true
        type: string
      runner_type:
        description: 'self-hosted (runner propri) | github (runner GitHub-hosted)'
        required: false
        default: 'self-hosted'
        type: string
      project_dir:
        description: 'Sottocartella del repo con il Cargo.toml dell''app'
        required: false
        default: 'desktop-native'
        type: string
      max_workers:
        description: >-
          Worker di Gradle/cargo (e di CMake) per questo run. auto = sul self-hosted le CPU libere
          in quel momento, mai sotto 2; su GitHub tutte | 2 | 4. Stesso input, stessi valori e
          stesso significato in flutter-ci, expo-ci e desktop-ci (GabryXnLab/build-kit).
        required: false
        default: 'auto'
        type: string
      clear_cache:
        description: >-
          Sul self-hosted cancella la cartella target di cargo del repo e, per questo run,
          sccache ricompila e riscrive invece di fidarsi della cache condivisa. Su GitHub il
          run non riprende né salva la cache di cargo.
        required: false
        default: false
        type: boolean
      build_debug:
        description: 'true → profilo dev (veloce, con debuginfo). false → profilo `dist` del progetto (LTO completo).'
        required: false
        default: false
        type: boolean
      has_submodules:
        description: 'true → checkout con submodules: recursive'
        required: false
        default: false
        type: boolean
      selfhosted_linux_runner:
        description: 'runs-on per linux-arm64 self-hosted quando runner_type=self-hosted e nessun override (JSON array).'
        required: false
        default: '["self-hosted","nexus-core"]'
        type: string
      linux_x64_runner:
        description: 'Override runs-on per linux-x64 (JSON array). Vuoto = default dal runner_type.'
        required: false
        default: ''
        type: string
      linux_arm64_runner:
        description: 'Override runs-on per linux-arm64 (JSON array). Vuoto = default dal runner_type.'
        required: false
        default: ''
        type: string
      windows_runner:
        description: 'Override runs-on per Windows (JSON array). Vuoto = default dal runner_type.'
        required: false
        default: ''
        type: string
      macos_runner:
        description: 'Override runs-on per macOS (JSON array). Vuoto = default dal runner_type.'
        required: false
        default: ''
        type: string
      telegram_topic_id:
        description: 'Topic del supergruppo Telegram per la notifica (message_thread_id). Vuoto = nessuna notifica.'
        required: false
        default: ''
        type: string
      package:
        description: 'true → anche i pacchetti con cargo-packager (config in [package.metadata.packager] del Cargo.toml): deb+AppImage, NSIS, app+dmg. Firmati per l''updater se c''è TAURI_SIGNING_PRIVATE_KEY.'
        required: false
        default: false
        type: boolean
      cargo_packager_version:
        description: 'Versione di cargo-packager (fissata: un bundler nuovo cambia i pacchetti).'
        required: false
        default: '0.11.8'
        type: string
      publish_release:
        description: 'true → dopo la build pubblica i pacchetti firmati su releases_repo (richiede package, build_debug=false, TAURI_SIGNING_* e RELEASES_TOKEN).'
        required: false
        default: false
        type: boolean
      releases_repo:
        description: '[Publish] owner/repo pubblico delle release (l''updater scarica senza autenticazione).'
        required: false
        default: ''
        type: string
      release_tag_prefix:
        description: '[Publish] Prefisso del tag della release: <prefisso><versione del Cargo.toml>.'
        required: false
        default: 'v'
        type: string
      make_latest:
        description: '[Publish] La release diventa la «latest» del repo. false se un''altra app pubblica lì il suo latest.json (es. la desktop Tauri durante la migrazione).'
        required: false
        default: true
        type: boolean
      manifest_command:
        description: >-
          [Publish] Comando del progetto (bash, dalla root del repo) che scrive i manifest
          dell'updater: riceve VERSION, ASSETS_DIR (una cartella packages-<os>-<arch> per target),
          RELEASE_URL, PUB_DATE, NOTES_FILE e OUT_DIR, e scrive OUT_DIR/<tag>/latest.json per ogni
          release a tag fisso (canale) da aggiornare. Vuoto = latest.json di Tauri v2 nella release.
        required: false
        default: ''
        type: string
      release_notes:
        description: '[Publish] Note della release. Vuoto = «<app_name> <tag>».'
        required: false
        default: ''
        type: string
    secrets:
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false
      SUBMODULES_TOKEN:
        required: false
      # Chiave minisign dell'updater, nel formato di `tauri signer generate` / `cargo packager signer generate`.
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      # PAT con Contents: Read & Write sul solo releases_repo.
      RELEASES_TOKEN:
        required: false

jobs:
  setup:
    name: Resolve & validate targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Build & validate matrix
        id: gen
        env:
          PLATFORMS: ${{ inputs.platforms }}
          RUNNER_TYPE: ${{ inputs.runner_type }}
          SELFHOSTED_LINUX: ${{ inputs.selfhosted_linux_runner }}
          LINUX_X64_OVERRIDE: ${{ inputs.linux_x64_runner }}
          LINUX_ARM64_OVERRIDE: ${{ inputs.linux_arm64_runner }}
          WINDOWS_OVERRIDE: ${{ inputs.windows_runner }}
          MACOS_OVERRIDE: ${{ inputs.macos_runner }}
          PUBLISH: ${{ inputs.publish_release }}
          PACKAGE: ${{ inputs.package }}
          BUILD_DEBUG: ${{ inputs.build_debug }}
          RELEASES_REPO: ${{ inputs.releases_repo }}
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          HAS_RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_TYPE" != "self-hosted" ] && [ "$RUNNER_TYPE" != "github" ]; then
            echo "::error::runner_type non valido: '$RUNNER_TYPE' (attesi: self-hosted | github)"; exit 1
          fi
          toks=$(echo "$PLATFORMS" | tr 'A-Z' 'a-z' | tr ', ' '\n\n' | sed '/^$/d')
          entries=""; incompat=""; seen=""
          add() { # $1=os $2=arch $3=runner-json $4=apt
            case " $seen " in *" $1-$2 "*) return 0 ;; esac
            seen="$seen $1-$2"
            local r; r=$(printf '{"os":"%s","arch":"%s","runner":%s,"apt":%s}' "$1" "$2" "$3" "$4")
            if [ -z "$entries" ]; then entries="$r"; else entries="$entries,$r"; fi
          }
          while read -r p; do
            case "$p" in
              linux-x64|linux_x64|linux-x86_64|linux-amd64|x64|x86_64) target=linux-x64 ;;
              linux|linux-arm64|linux_arm64|linux-aarch64|arm64|aarch64) target=linux-arm64 ;;
              windows|win) target=windows ;;
              macos|mac|darwin) target=macos ;;
              *) echo "::warning::target ignoto '$p' ignorato"; continue ;;
            esac
            case "$target" in
              linux-x64)
                if [ -n "$LINUX_X64_OVERRIDE" ]; then add linux x64 "$LINUX_X64_OVERRIDE" true
                elif [ "$RUNNER_TYPE" = "github" ]; then add linux x64 '["ubuntu-latest"]' true
                else incompat="$incompat linux-x64"; fi ;;
              linux-arm64)
                if [ -n "$LINUX_ARM64_OVERRIDE" ]; then add linux arm64 "$LINUX_ARM64_OVERRIDE" true
                elif [ "$RUNNER_TYPE" = "github" ]; then add linux arm64 '["ubuntu-24.04-arm"]' true
                # Sul self-hosted le librerie di sistema sono già installate (nexus-core).
                else add linux arm64 "$SELFHOSTED_LINUX" false; fi ;;
              windows)
                if [ -n "$WINDOWS_OVERRIDE" ]; then add windows x64 "$WINDOWS_OVERRIDE" false
                elif [ "$RUNNER_TYPE" = "github" ]; then add windows x64 '["windows-latest"]' false
                else incompat="$incompat windows"; fi ;;
              macos)
                if [ -n "$MACOS_OVERRIDE" ]; then add macos arm64 "$MACOS_OVERRIDE" false
                elif [ "$RUNNER_TYPE" = "github" ]; then add macos arm64 '["macos-latest"]' false
                else incompat="$incompat macos"; fi ;;
            esac
          done <<< "$toks"
          if [ -n "$incompat" ]; then
            echo "::error::runner_type=self-hosted ma i target [${incompat# }] NON sono compatibili con l'ambiente self-hosted (Linux ARM64). Usa 'runner = github' o passa un runner dedicato via *_runner. Nessuna build avviata."
            exit 1
          fi
          if [ -z "$entries" ]; then
            echo "::error::Nessun target valido in '$PLATFORMS' (attesi: linux-x64, linux-arm64, windows, macos)"; exit 1
          fi
          # Una pubblicazione si ferma qui, prima di qualunque build, se manca un pezzo.
          if [ "$PUBLISH" = "true" ]; then
            [ "$PACKAGE" = "true" ] || { echo "::error::publish_release=true richiede package=true"; exit 1; }
            [ "$BUILD_DEBUG" != "true" ] || { echo "::error::publish_release=true richiede build_debug=false"; exit 1; }
            [ -n "$RELEASES_REPO" ] || { echo "::error::publish_release=true richiede releases_repo"; exit 1; }
            [ "$HAS_KEY" = "true" ] || { echo "::error::publish_release=true richiede il secret TAURI_SIGNING_PRIVATE_KEY: non si pubblica un updater non firmato"; exit 1; }
            [ "$HAS_RELEASES_TOKEN" = "true" ] || { echo "::error::publish_release=true richiede il secret RELEASES_TOKEN"; exit 1; }
          fi
          echo "matrix={\"include\":[$entries]}" >> "$GITHUB_OUTPUT"
          echo "Matrix: {\"include\":[$entries]}"

      - name: Notify failure via Telegram
        if: ${{ failure() || cancelled() }}
        uses: GabryXnLab/build-kit/notify@main
        with:
          run_inputs: ${{ toJSON(github.event.inputs) }}
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          topic_id: ${{ inputs.telegram_topic_id }}
          status: ${{ job.status }}
          title: ${{ inputs.app_name }}, risoluzione dei target

  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: ${{ inputs.project_dir }}
        shell: bash
    steps:
      - name: Notify start via Telegram
        id: started
        uses: GabryXnLab/build-kit/notify@main
        with:
          run_inputs: ${{ toJSON(github.event.inputs) }}
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          topic_id: ${{ inputs.telegram_topic_id }}
          status: started
          title: ${{ inputs.app_name }} ${{ matrix.os }}-${{ matrix.arch }}

      - uses: actions/checkout@v4
        with:
          clean: ${{ !contains(toJSON(matrix.runner), 'self-hosted') }}
          submodules: ${{ inputs.has_submodules && 'recursive' || 'false' }}
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Tune build
        id: tune
        uses: GabryXnLab/build-kit/setup@main
        with:
          runner: ${{ contains(toJSON(matrix.runner), 'self-hosted') && 'self-hosted' || 'github' }}
          max_workers: ${{ inputs.max_workers }}
          clear_cache: ${{ inputs.clear_cache }}
          rust: 'true'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache (GitHub runner)
        if: ${{ !contains(toJSON(matrix.runner), 'self-hosted') && inputs.clear_cache != true }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.project_dir }} -> target

      # GPUI su Linux: X11 e Wayland (xkbcommon), font (fontconfig), Vulkan (wgpu); DBus per il
      # portachiavi (Secret Service, crate keyring); GTK 3 per l'icona di sistema (crate gtk/tray-icon).
      - name: Install Linux system deps (GPUI)
        if: ${{ matrix.os == 'linux' && matrix.apt == true }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev \
            libfontconfig-dev libfreetype-dev libvulkan-dev libdbus-1-dev libgtk-3-dev libssl-dev pkg-config build-essential

      - name: Cargo build
        id: build
        env:
          CARGO_DIR: ${{ steps.tune.outputs.cargo_target_dir }}
          BUILD_DEBUG: ${{ inputs.build_debug }}
          BIN: ${{ inputs.bin_name }}
          APP: ${{ inputs.app_name }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          if [ "$BUILD_DEBUG" = "true" ]; then profile=dev; outdir=debug; else profile=dist; outdir=dist; fi
          cargo build --locked --profile "$profile"
          target="${CARGO_DIR:-$GITHUB_WORKSPACE/${{ inputs.project_dir }}/target}"
          ext=""; [ "$OS" = "windows" ] && ext=".exe"
          bin="$target/$outdir/$BIN$ext"
          test -f "$bin"
          pkgdir="$GITHUB_WORKSPACE/gpui-out"
          rm -rf "$pkgdir"; mkdir -p "$pkgdir"
          name="$APP-$OS-$ARCH"
          cp "$bin" "$pkgdir/"
          if [ "$OS" = "windows" ]; then
            (cd "$pkgdir" && 7z a -bd "$name.zip" "$BIN$ext" >/dev/null)
          else
            tar -C "$pkgdir" -czf "$pkgdir/$name.tar.gz" "$BIN"
          fi
          ls -la "$pkgdir"
          echo "dir=$pkgdir" >> "$GITHUB_OUTPUT"
          if [ -n "${RUSTC_WRAPPER:-}" ]; then "$RUSTC_WRAPPER" --show-stats | grep -E 'Cache (hits|misses)' || true; fi

      # Sul self-hosted lo strumento resta in ~/ci/tools, una versione per cartella; su GitHub si
      # compila nel run (~3 min). Fuori dalla target del progetto: cargo install non deve toccarla.
      - name: Install cargo-packager
        if: ${{ inputs.package }}
        env:
          VERSION: ${{ inputs.cargo_packager_version }}
          SELF_HOSTED: ${{ contains(toJSON(matrix.runner), 'self-hosted') }}
        run: |
          set -euo pipefail
          if [ "$SELF_HOSTED" = "true" ]; then root="$HOME/ci/tools/cargo-packager-$VERSION"; else root="$RUNNER_TEMP/cargo-packager"; fi
          if [ ! -x "$root/bin/cargo-packager" ] && [ ! -x "$root/bin/cargo-packager.exe" ]; then
            CARGO_TARGET_DIR="$RUNNER_TEMP/cargo-packager-build" cargo install cargo-packager --locked --version "$VERSION" --root "$root"
          fi
          echo "$root/bin" >> "$GITHUB_PATH"

      - name: Package
        id: package
        if: ${{ inputs.package }}
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          BUILD_DEBUG: ${{ inputs.build_debug }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          case "$OS" in
            linux) formats=deb,appimage ;;
            windows) formats=nsis ;;
            macos) formats=app,dmg ;;
          esac
          # cargo-packager cerca il binario in target/<profilo>: «debug» per il profilo dev.
          profile=dist; [ "$BUILD_DEBUG" = "true" ] && profile=debug
          args=(--profile "$profile" --formats "$formats")
          if [ -z "$CARGO_PACKAGER_SIGN_PRIVATE_KEY" ]; then
            # Una variabile vuota la leggerebbe come chiave: senza secret i pacchetti escono senza .sig.
            unset CARGO_PACKAGER_SIGN_PRIVATE_KEY CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD
            echo "::warning::nessuna TAURI_SIGNING_PRIVATE_KEY: pacchetti senza firma dell'updater"
          elif [ -z "$CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD" ]; then
            # Senza password esplicita cargo-packager la chiederebbe sul terminale.
            unset CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD
            args+=(--password "")
          fi
          pkgdir="$GITHUB_WORKSPACE/gpui-packages/packages-$OS-$ARCH"
          rm -rf "$GITHUB_WORKSPACE/gpui-packages"; mkdir -p "$pkgdir"
          # L'AppImage si monta con FUSE, che sui runner (e nei container) spesso non c'è.
          APPIMAGE_EXTRACT_AND_RUN=1 cargo packager "${args[@]}" --out-dir "$pkgdir"
          # Restano solo i file: gli intermedi (.cargo-packager/) e le cartelle .app (su macOS conta il dmg) no.
          find "$pkgdir" -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
          ls -la "$pkgdir"
          echo "dir=$pkgdir" >> "$GITHUB_OUTPUT"

      # Bloccante solo quando lo scarica il job di pubblicazione (regola di build-kit).
      - name: Upload packages
        if: ${{ inputs.package }}
        uses: actions/upload-artifact@v4
        continue-on-error: ${{ !inputs.publish_release }}
        with:
          name: packages-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ steps.package.outputs.dir }}
          if-no-files-found: error
          retention-days: 3

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ inputs.app_name }}-${{ matrix.os }}-${{ matrix.arch }}-${{ github.sha }}
          path: |
            ${{ steps.build.outputs.dir }}/*.tar.gz
            ${{ steps.build.outputs.dir }}/*.zip
          if-no-files-found: warn
          retention-days: 3

      - name: Notify via Telegram
        if: ${{ always() }}
        uses: GabryXnLab/build-kit/notify@main
        with:
          message_id: ${{ steps.started.outputs.message_id }}
          run_inputs: ${{ toJSON(github.event.inputs) }}
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          topic_id: ${{ inputs.telegram_topic_id }}
          status: ${{ job.status }}
          title: ${{ inputs.app_name }} ${{ matrix.os }}-${{ matrix.arch }}
          files: |
            gpui-out/*.tar.gz
            gpui-out/*.zip
            gpui-packages/*/*.deb
            gpui-packages/*/*.AppImage
            gpui-packages/*/*.exe
            gpui-packages/*/*.dmg

  # PUBLISH — solo con publish_release e build non-debug, dopo TUTTA la matrice (needs: build:
  # un target fallito salta la pubblicazione, niente release parziali). Prima la release
  # versionata coi pacchetti, poi i manifest: un manifest non punta mai a un file che non c'è.
  publish:
    name: Publish updater release
    needs: build
    if: ${{ inputs.publish_release == true && inputs.build_debug == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify start via Telegram
        id: started
        uses: GabryXnLab/build-kit/notify@main
        with:
          run_inputs: ${{ toJSON(github.event.inputs) }}
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          topic_id: ${{ inputs.telegram_topic_id }}
          status: started
          title: ${{ inputs.app_name }}, pubblicazione su ${{ inputs.releases_repo }}

      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        env:
          PROJECT_DIR: ${{ inputs.project_dir }}
          BIN: ${{ inputs.bin_name }}
          PREFIX: ${{ inputs.release_tag_prefix }}
        run: |
          set -euo pipefail
          v=$(cargo metadata --no-deps --format-version 1 --manifest-path "$PROJECT_DIR/Cargo.toml" | jq -r --arg n "$BIN" '.packages[] | select(.name == $n) | .version')
          if [ -z "$v" ] || [ "$v" = "null" ]; then echo "::error::versione di $BIN non trovata in $PROJECT_DIR/Cargo.toml"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=$PREFIX$v" >> "$GITHUB_OUTPUT"
          case "$v" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: assets

      - name: Manifests
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
          RELEASES_REPO: ${{ inputs.releases_repo }}
          MANIFEST_COMMAND: ${{ inputs.manifest_command }}
          NOTES: ${{ inputs.release_notes }}
          APP: ${{ inputs.app_name }}
        run: |
          set -euo pipefail
          export ASSETS_DIR="$GITHUB_WORKSPACE/assets" OUT_DIR="$GITHUB_WORKSPACE/channels" NOTES_FILE="$RUNNER_TEMP/notes.md"
          export RELEASE_URL="https://github.com/$RELEASES_REPO/releases/download/$TAG"
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ); export PUB_DATE
          printf '%s\n' "${NOTES:-$APP $TAG}" > "$NOTES_FILE"
          mkdir -p "$OUT_DIR" release-assets
          find assets -type f -exec cp {} release-assets/ \;
          if [ -n "$MANIFEST_COMMAND" ]; then
            bash -c "$MANIFEST_COMMAND"
          else
            platforms='{}'
            while IFS= read -r -d '' sig; do
              pkg="${sig%.sig}"; [ -f "$pkg" ] || continue
              dir=$(basename "$(dirname "$sig")")
              case "${dir#packages-}" in
                linux-x64) k=linux-x86_64 ;; linux-arm64) k=linux-aarch64 ;;
                windows-x64) k=windows-x86_64 ;; macos-arm64) k=darwin-aarch64 ;; *) continue ;;
              esac
              case "$pkg" in *.deb) k="$k-deb" ;; *.app.tar.gz) continue ;; esac
              name=$(basename "$pkg" | tr ' ' '.')
              platforms=$(jq --arg k "$k" --arg url "$RELEASE_URL/$name" --arg sig "$(cat "$sig")" '. + {($k): {signature: $sig, url: $url}}' <<< "$platforms")
            done < <(find assets -type f -name '*.sig' -print0)
            [ "$platforms" != '{}' ] || { echo "::error::nessun pacchetto firmato (.sig) fra gli artefatti"; exit 1; }
            jq -n --arg v "$VERSION" --arg n "$(cat "$NOTES_FILE")" --arg d "$PUB_DATE" --argjson p "$platforms" \
              '{version: $v, notes: $n, pub_date: $d, platforms: $p}' > release-assets/latest.json
          fi
          ls -la release-assets "$OUT_DIR"

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          PRERELEASE: ${{ steps.ver.outputs.prerelease }}
          MAKE_LATEST: ${{ inputs.make_latest && steps.ver.outputs.prerelease != 'true' }}
          RELEASES_REPO: ${{ inputs.releases_repo }}
          APP: ${{ inputs.app_name }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --repo "$RELEASES_REPO" --clobber
          else
            flags=(--title "$APP $TAG" --notes-file "$notes" --latest="$MAKE_LATEST")
            [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
            gh release create "$TAG" release-assets/* --repo "$RELEASES_REPO" "${flags[@]}"
          fi
          # Le release dei canali sono pre-release a tag fisso: mai la «latest» del repo.
          for dir in channels/*/; do
            [ -d "$dir" ] || continue
            ctag=$(basename "$dir")
            if ! gh release view "$ctag" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
              gh release create "$ctag" --repo "$RELEASES_REPO" --prerelease --latest=false \
                --title "$APP, canale $ctag" --notes "Manifest dell'updater del canale, riscritto a ogni pubblicazione. I pacchetti stanno nelle release versionate."
            fi
            gh release upload "$ctag" "$dir"* --repo "$RELEASES_REPO" --clobber
            echo "canale $ctag → $TAG"
          done

      - name: Notify via Telegram
        if: ${{ always() }}
        uses: GabryXnLab/build-kit/notify@main
        with:
          message_id: ${{ steps.started.outputs.message_id }}
          run_inputs: ${{ toJSON(github.event.inputs) }}
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          topic_id: ${{ inputs.telegram_topic_id }}
          status: ${{ job.status }}
          title: ${{ inputs.app_name }}, release ${{ steps.ver.outputs.tag }} su ${{ inputs.releases_repo }}
