name: Tauri Build (reusable)

# Workflow riusabile per build dell'app desktop Tauri v2 (Rust + Vite/React).
# Centralizza la CI/CD desktop condivisa tra più progetti, analogo a expo-ci per il mobile.
# Chiamato da thin wrappers nei singoli progetti via:
#   uses: GabryXnLab/desktop-ci/.github/workflows/tauri-build.yml@main
#
# ⚠️ Build NATIVA per OS *e architettura*: Tauri compila per la piattaforma del runner,
# non cross-compila. Target supportati (input `platforms`, CSV):
#   - linux-x64    → .deb/.AppImage/.rpm  (x86_64) — richiede GTK/WebKit
#   - linux-arm64  → .deb/.AppImage/.rpm  (aarch64) — richiede GTK/WebKit
#   - windows      → .msi/.exe NSIS       (x86_64) — toolchain MSVC + WebView2
#   - macos        → .dmg/.app            (Apple Silicon) — host macOS + Xcode
#   (alias accettati: linux→linux-arm64, x64/x86_64→linux-x64, win→windows, mac/darwin→macos)
#
# Scelta del runner (`runner_type`):
#   - self-hosted : l'ambiente self-hosted di default è Linux ARM64 → solo `linux-arm64` è
#                   nativamente compatibile. Gli altri target (linux-x64/windows/macos) senza
#                   un override *_runner dedicato fanno FALLIRE il job `setup` con errore
#                   esplicito → nessuna build parte.
#   - github      : ogni target sul runner GitHub-hosted nativo
#                   (linux-x64→ubuntu-latest, linux-arm64→ubuntu-24.04-arm,
#                    windows→windows-latest, macos→macos-latest).
#
# Pubblicazione updater (opzionale, `publish_release: true`): dopo la build, il job `publish`
# raccoglie gli artefatti updater firmati (installer + `.sig`, richiede `createUpdaterArtifacts`
# attivo nel progetto + secret TAURI_SIGNING_PRIVATE_KEY(+_PASSWORD)) e pubblica una GitHub
# Release + manifest `latest.json` (schema Tauri v2) sul repo `releases_repo`. Pensato per un
# repo PUBBLICO dedicato ai soli binari quando il repo sorgente è privato: gli asset di una
# Release privata non sono scaricabili in anonimo, ma l'updater Tauri fa una richiesta HTTP
# senza autenticazione. Richiede il secret RELEASES_TOKEN (PAT con Contents:Read&Write sul
# repo releases).

on:
  workflow_call:
    inputs:
      app_name:
        description: 'Nome app (es. WarpMobile) — usato per artifact name e notifiche Telegram'
        required: true
        type: string
      platforms:
        description: 'Target da buildare, CSV: es. "linux-x64,linux-arm64,windows,macos" (1 o più)'
        required: true
        type: string
      runner_type:
        description: 'self-hosted (runner propri) | github (runner GitHub-hosted)'
        required: false
        default: 'self-hosted'
        type: string
      project_dir:
        description: 'Sottocartella del repo che contiene il progetto Tauri (package.json + src-tauri/)'
        required: false
        default: 'desktop'
        type: string
      build_debug:
        description: 'true → build di debug (più veloce, non firmata). false → release (default).'
        required: false
        default: false
        type: boolean
      has_submodules:
        description: 'true → checkout con submodules: recursive (serve se il frontend usa @shared o submoduli)'
        required: false
        default: false
        type: boolean
      install_system_deps:
        description: 'true → su Linux forza apt delle librerie GTK/WebKit. NB: con runner_type=github su Linux vengono installate comunque (i runner GitHub non le hanno).'
        required: false
        default: false
        type: boolean
      setup_rust:
        description: 'true → assicura la toolchain Rust stable via rustup (idempotente). false se il runner ce l’ha già.'
        required: false
        default: true
        type: boolean
      selfhosted_linux_runner:
        description: 'runs-on per linux-arm64 self-hosted quando runner_type=self-hosted e nessun override (JSON array).'
        required: false
        default: '["self-hosted","nexus-core"]'
        type: string
      linux_x64_runner:
        description: 'Override runs-on per linux-x64 (JSON array). Vuoto = default dal runner_type. Su self-hosted SENZA override → errore.'
        required: false
        default: ''
        type: string
      linux_arm64_runner:
        description: 'Override runs-on per linux-arm64 (JSON array). Vuoto = default dal runner_type.'
        required: false
        default: ''
        type: string
      windows_runner:
        description: 'Override runs-on per Windows (JSON array). Vuoto = default dal runner_type. Su self-hosted SENZA override → errore.'
        required: false
        default: ''
        type: string
      macos_runner:
        description: 'Override runs-on per macOS (JSON array). Vuoto = default dal runner_type. Su self-hosted SENZA override → errore.'
        required: false
        default: ''
        type: string
      node_version:
        description: 'Versione Node.js'
        required: false
        default: '22'
        type: string
      publish_release:
        description: 'true → dopo la build pubblica una GitHub Release + latest.json (manifest updater Tauri v2) sul repo releases_repo. Richiede createUpdaterArtifacts attivo + secret TAURI_SIGNING_*/RELEASES_TOKEN.'
        required: false
        default: false
        type: boolean
      releases_repo:
        description: '[Publish] owner/repo (idealmente pubblico) dove pubblicare la release updater, es. "org/app-releases". Richiesto se publish_release=true.'
        required: false
        default: ''
        type: string
      release_notes:
        description: '[Publish] Note di rilascio opzionali (release + latest.json). Default: generato automaticamente dalla versione.'
        required: false
        default: ''
        type: string
      telegram_topic_id:
        description: 'Topic del supergruppo Telegram in cui pubblicare la notifica (message_thread_id). Vuoto = nessuna notifica.'
        required: false
        default: ''
        type: string
    secrets:
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false
      # PAT (read-only Contents) per clonare submodule privati in repo diverse.
      SUBMODULES_TOKEN:
        required: false
      # Firma artefatti Tauri updater (facoltativa). Se assenti, build non firmata.
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      # PAT con Contents:Read&Write sul repo `releases_repo` (facoltativo, richiesto solo se
      # publish_release=true). NON è lo stesso token di SUBMODULES_TOKEN (quello è read-only).
      RELEASES_TOKEN:
        required: false

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # SETUP / VALIDAZIONE — `platforms` (CSV) + `runner_type` → matrix.
  # CONTROLLO DI COMPATIBILITÀ: con runner_type=self-hosted i target non compatibili
  # con l'ambiente self-hosted (Linux ARM64) — cioè linux-x64/windows/macos senza
  # override dedicato — fanno uscire il job con errore → nessuna build parte.
  # Gira su ubuntu-latest: disponibile anche quando il self-hosted è offline/incompatibile.
  # ────────────────────────────────────────────────────────────────────────────
  setup:
    name: Resolve & validate targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Build & validate matrix
        id: gen
        env:
          PLATFORMS: ${{ inputs.platforms }}
          RUNNER_TYPE: ${{ inputs.runner_type }}
          SELFHOSTED_LINUX: ${{ inputs.selfhosted_linux_runner }}
          LINUX_X64_OVERRIDE: ${{ inputs.linux_x64_runner }}
          LINUX_ARM64_OVERRIDE: ${{ inputs.linux_arm64_runner }}
          WINDOWS_OVERRIDE: ${{ inputs.windows_runner }}
          MACOS_OVERRIDE: ${{ inputs.macos_runner }}
          INSTALL_SYS_DEPS: ${{ inputs.install_system_deps }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_TYPE" != "self-hosted" ] && [ "$RUNNER_TYPE" != "github" ]; then
            echo "::error::runner_type non valido: '$RUNNER_TYPE' (attesi: self-hosted | github)"; exit 1
          fi
          toks=$(echo "$PLATFORMS" | tr 'A-Z' 'a-z' | tr ', ' '\n\n' | sed '/^$/d')
          echo "runner_type=$RUNNER_TYPE"; echo "Target richiesti:"; echo "$toks"

          entries=""; incompat=""; seen=""
          # NB: niente brace-expansion ({a,b,c}) nel glob — actions/upload-artifact@v4
          # usa @actions/glob (minimatch senza brace expansion): un pattern con {..} non
          # fa match con nessun file (fallisce silenziosamente, "No files were found").
          # "bundle/**" cattura ricorsivamente tutti i formati sotto la cartella bundle.
          GLOB_LINUX='bundle/**'
          add() { # $1=os $2=arch $3=runner-json $4=glob $5=apt
            case " $seen " in *" $1-$2 "*) return 0 ;; esac   # dedup target
            seen="$seen $1-$2"
            local r; r=$(printf '{"os":"%s","arch":"%s","runner":%s,"bundle_glob":"%s","apt":%s}' "$1" "$2" "$3" "$4" "$5")
            if [ -z "$entries" ]; then entries="$r"; else entries="$entries,$r"; fi
          }

          while read -r p; do
            case "$p" in
              linux-x64|linux_x64|linux-x86_64|linux-amd64|x64|x86_64) target=linux-x64 ;;
              linux|linux-arm64|linux_arm64|linux-aarch64|arm64|aarch64) target=linux-arm64 ;;
              windows|win) target=windows ;;
              macos|mac|darwin) target=macos ;;
              *) echo "::warning::target ignoto '$p' ignorato"; continue ;;
            esac
            case "$target" in
              linux-x64)
                if [ -n "$LINUX_X64_OVERRIDE" ]; then add linux x64 "$LINUX_X64_OVERRIDE" "$GLOB_LINUX" "$INSTALL_SYS_DEPS"
                elif [ "$RUNNER_TYPE" = "github" ]; then add linux x64 '["ubuntu-latest"]' "$GLOB_LINUX" true
                else incompat="$incompat linux-x64"; fi ;;
              linux-arm64)
                if [ -n "$LINUX_ARM64_OVERRIDE" ]; then add linux arm64 "$LINUX_ARM64_OVERRIDE" "$GLOB_LINUX" "$INSTALL_SYS_DEPS"
                elif [ "$RUNNER_TYPE" = "github" ]; then add linux arm64 '["ubuntu-24.04-arm"]' "$GLOB_LINUX" true
                else add linux arm64 "$SELFHOSTED_LINUX" "$GLOB_LINUX" "$INSTALL_SYS_DEPS"; fi ;;
              windows)
                if [ -n "$WINDOWS_OVERRIDE" ]; then add windows x64 "$WINDOWS_OVERRIDE" 'bundle/**' false
                elif [ "$RUNNER_TYPE" = "github" ]; then add windows x64 '["windows-latest"]' 'bundle/**' false
                else incompat="$incompat windows"; fi ;;
              macos)
                if [ -n "$MACOS_OVERRIDE" ]; then add macos arm64 "$MACOS_OVERRIDE" 'bundle/**' false
                elif [ "$RUNNER_TYPE" = "github" ]; then add macos arm64 '["macos-latest"]' 'bundle/**' false
                else incompat="$incompat macos"; fi ;;
            esac
          done <<< "$toks"

          # ── Controllo compatibilità self-hosted ──────────────────────────────
          if [ -n "$incompat" ]; then
            echo "::error::runner_type=self-hosted ma i target [${incompat# }] NON sono compatibili con l'ambiente self-hosted (Linux ARM64). Tauri non cross-compila: x86_64/Windows/macOS richiedono il loro host. Soluzioni: (1) imposta 'Runner desktop = github' per buildarli sui runner GitHub-hosted; (2) registra un runner self-hosted dedicato e passalo via input *_runner. Workflow interrotto: nessuna build avviata."
            exit 1
          fi
          if [ -z "$entries" ]; then
            echo "::error::Nessun target valido in '$PLATFORMS' (attesi: linux-x64, linux-arm64, windows, macos)"; exit 1
          fi
          echo "matrix={\"include\":[$entries]}" >> "$GITHUB_OUTPUT"
          echo "Matrix: {\"include\":[$entries]}"

      # Se la matrice non si risolve, build e publish vengono saltati e non notificherebbero.
      - name: Notify failure via Telegram
        if: ${{ failure() || cancelled() }}
        uses: GabryXnLab/ci-bot/notify@main
        with:
          run_inputs: ${{ toJSON(github.event.inputs) }}
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          topic_id: ${{ inputs.telegram_topic_id }}
          status: ${{ job.status }}
          title: ${{ inputs.app_name }} desktop, risoluzione dei target

  # ────────────────────────────────────────────────────────────────────────────
  # BUILD — un job per target compatibile, sul runner nativo risolto da setup.
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: ${{ inputs.project_dir }}
    steps:
      # «In corso» con ⏹ Annulla (ci-bot); lo step finale riscrive lo stesso messaggio.
      - name: Notify start via Telegram
        id: started
        uses: GabryXnLab/ci-bot/notify@main
        with:
          run_inputs: ${{ toJSON(github.event.inputs) }}
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          topic_id: ${{ inputs.telegram_topic_id }}
          status: started
          title: ${{ inputs.app_name }} desktop ${{ matrix.os }}-${{ matrix.arch }}
      - uses: actions/checkout@v4
        with:
          submodules: ${{ inputs.has_submodules && 'recursive' || 'false' }}
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      # Toolchain Rust stable (idempotente: no-op se già presente con rustup).
      - name: Setup Rust
        if: ${{ inputs.setup_rust == true }}
        uses: dtolnay/rust-toolchain@stable

      # Librerie di sistema per la WebView Tauri su Linux. Necessarie sui runner
      # GitHub-hosted e sui self-hosted freschi. matrix.apt è calcolato in setup.
      - name: Install Linux system deps (Tauri)
        if: ${{ matrix.os == 'linux' && matrix.apt == true }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            build-essential curl wget file libssl-dev pkg-config

      # Il progetto desktop è npm-based (package-lock.json). `npm ci` = install riproducibile.
      # `tauri build` lancia da solo beforeBuildCommand (npm run build → tsc + vite build).
      - name: Install JS dependencies
        shell: bash
        run: npm ci

      - name: Tauri build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          args=(build)
          if [ "${{ inputs.build_debug }}" = "true" ]; then
            args+=(--debug)
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            if [ "${{ inputs.publish_release }}" = "true" ]; then
              echo "::error::publish_release=true richiede il secret TAURI_SIGNING_PRIVATE_KEY"
              exit 1
            fi
            # I progetti possono tenere createUpdaterArtifacts=true per le release firmate:
            # una build ordinaria senza chiave deve comunque produrre installer installabili.
            args+=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          fi
          npm run tauri -- "${args[@]}"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}-desktop-${{ matrix.os }}-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ inputs.project_dir }}/src-tauri/target/${{ inputs.build_debug && 'debug' || 'release' }}/${{ matrix.bundle_glob }}
          if-no-files-found: warn
          retention-days: 3

      # Esito sempre (azione e bot in GabryXnLab/ci-bot): un file per ciascun formato di bundle
      # se il job riesce, altrimenti il pulsante per rilanciare il run. Best-effort.
      # L'azione gira dalla radice del workspace, non da project_dir: i pattern lo includono.
      - name: Notify via Telegram
        if: ${{ always() }}
        uses: GabryXnLab/ci-bot/notify@main
        with:
          message_id: ${{ steps.started.outputs.message_id }}
          run_inputs: ${{ toJSON(github.event.inputs) }}
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          topic_id: ${{ inputs.telegram_topic_id }}
          status: ${{ job.status }}
          title: ${{ inputs.app_name }} desktop ${{ matrix.os }}-${{ matrix.arch }}
          files: |
            ${{ inputs.project_dir }}/src-tauri/target/${{ inputs.build_debug && 'debug' || 'release' }}/bundle/**/*.deb
            ${{ inputs.project_dir }}/src-tauri/target/${{ inputs.build_debug && 'debug' || 'release' }}/bundle/**/*.AppImage
            ${{ inputs.project_dir }}/src-tauri/target/${{ inputs.build_debug && 'debug' || 'release' }}/bundle/**/*.rpm
            ${{ inputs.project_dir }}/src-tauri/target/${{ inputs.build_debug && 'debug' || 'release' }}/bundle/**/*.msi
            ${{ inputs.project_dir }}/src-tauri/target/${{ inputs.build_debug && 'debug' || 'release' }}/bundle/**/*.exe
            ${{ inputs.project_dir }}/src-tauri/target/${{ inputs.build_debug && 'debug' || 'release' }}/bundle/**/*.dmg
            ${{ inputs.project_dir }}/src-tauri/target/${{ inputs.build_debug && 'debug' || 'release' }}/bundle/**/*.app.tar.gz

  # ────────────────────────────────────────────────────────────────────────────
  # PUBLISH — opzionale (publish_release=true, e solo su build non-debug): raccoglie gli
  # artefatti updater firmati (installer + `.sig`) da TUTTI i target della matrix e pubblica
  # una GitHub Release + latest.json (manifest Tauri v2) sul repo `releases_repo`. Richiede
  # `needs: build` con esito successo su TUTTA la matrix (fail-fast:false → se un target
  # fallisce, `build` risulta failure e publish viene saltato: niente release parziali).
  # ────────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish updater release
    needs: build
    if: ${{ inputs.publish_release == true && inputs.build_debug == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "${{ inputs.releases_repo }}" ]; then
            echo "::error::publish_release=true richiede l'input releases_repo (es. owner/repo)"; exit 1
          fi
          if [ -z "$RELEASES_TOKEN" ]; then
            echo "::error::publish_release=true richiede il secret RELEASES_TOKEN (PAT con Contents:Read&Write sul repo releases)"; exit 1
          fi

      # Checkout minimo, serve solo a leggere la versione da src-tauri/tauri.conf.json.
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          V=$(jq -r '.version' "${{ inputs.project_dir }}/src-tauri/tauri.conf.json")
          if [ -z "$V" ] || [ "$V" = "null" ]; then
            echo "::error::impossibile leggere .version da ${{ inputs.project_dir }}/src-tauri/tauri.conf.json"; exit 1
          fi
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Ogni .sig scaricato è abbinato al binario con lo stesso path meno ".sig" (più
      # resiliente dei nomi file esatti prodotti da Tauri, che variano per OS/versione).
      # La piattaforma (chiave latest.json) è dedotta dal nome della cartella artifact
      # (<app>-desktop-<os>-<arch>-<sha>, generata dal job build) → mappata sui nomi Tauri.
      - name: Build latest.json + collect release assets
        shell: bash
        env:
          VERSION_TAG: ${{ steps.ver.outputs.tag }}
          NOTES: ${{ inputs.release_notes }}
          RELEASES_REPO: ${{ inputs.releases_repo }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          PLATFORMS_JSON="{}"

          while IFS= read -r -d '' SIG; do
            BIN="${SIG%.sig}"
            if [ ! -f "$BIN" ]; then
              echo "::warning::sig senza binario corrispondente: $SIG"; continue
            fi
            ARTDIR=$(echo "$SIG" | sed -E 's#^artifacts/([^/]+)/.*#\1#')
            OS=$(echo "$ARTDIR" | sed -E 's/^.*-desktop-([a-z]+)-([a-z0-9]+)-[0-9a-f]+$/\1/')
            ARCH=$(echo "$ARTDIR" | sed -E 's/^.*-desktop-([a-z]+)-([a-z0-9]+)-[0-9a-f]+$/\2/')
            case "$OS-$ARCH" in
              linux-x64) PLAT=linux-x86_64 ;;
              linux-arm64) PLAT=linux-aarch64 ;;
              windows-x64) PLAT=windows-x86_64 ;;
              macos-arm64) PLAT=darwin-aarch64 ;;
              macos-x64) PLAT=darwin-x86_64 ;;
              *) echo "::warning::piattaforma non mappata per '$OS-$ARCH' (artifact dir: $ARTDIR)"; continue ;;
            esac

            BASENAME=$(basename "$BIN")
            cp "$BIN" "release-assets/$BASENAME"
            SIGNATURE=$(cat "$SIG")
            URL="https://github.com/${RELEASES_REPO}/releases/download/${VERSION_TAG}/${BASENAME}"
            PLATFORMS_JSON=$(jq --arg k "$PLAT" --arg url "$URL" --arg sig "$SIGNATURE" \
              '. + {($k): {"signature": $sig, "url": $url}}' <<< "$PLATFORMS_JSON")
          done < <(find artifacts -type f -name '*.sig' -print0)

          if [ "$PLATFORMS_JSON" = "{}" ]; then
            echo "::error::nessun artefatto updater (.sig) trovato tra i build artifact: createUpdaterArtifacts e i secret TAURI_SIGNING_* sono attivi nel job build?"; exit 1
          fi

          NOTES_FINAL="${NOTES:-WarpMobile Desktop ${VERSION_TAG}}"
          jq -n --arg version "${VERSION_TAG#v}" --arg notes "$NOTES_FINAL" --arg date "$PUB_DATE" \
            --argjson platforms "$PLATFORMS_JSON" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: $platforms}' \
            > release-assets/latest.json
          echo "--- latest.json ---"; cat release-assets/latest.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          NOTES: ${{ inputs.release_notes }}
          RELEASES_REPO: ${{ inputs.releases_repo }}
        run: |
          set -euo pipefail
          NOTES_FINAL="${NOTES:-WarpMobile Desktop ${TAG}}"
          if gh release view "$TAG" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --repo "$RELEASES_REPO" --clobber
          else
            gh release create "$TAG" release-assets/* --repo "$RELEASES_REPO" \
              --title "WarpMobile Desktop ${TAG}" --notes "$NOTES_FINAL"
          fi

      - name: Notify via Telegram
        if: ${{ always() }}
        uses: GabryXnLab/ci-bot/notify@main
        with:
          run_inputs: ${{ toJSON(github.event.inputs) }}
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          topic_id: ${{ inputs.telegram_topic_id }}
          status: ${{ job.status }}
          title: ${{ inputs.app_name }} desktop, release updater ${{ steps.ver.outputs.tag }} su ${{ inputs.releases_repo }}
